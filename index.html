<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Galaxy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>PIXEL GALAXY</h1>
<div class="box"><div class="res" id="res"></div><small id="cap"></small></div>
<canvas id="cv" width="128" height="80"></canvas>
<div class="box"><div class="row"><div id="info"></div><button id="atk" data-atk="1">Attack</button></div></div>
<p id="log">Tap a system on the map. Claim worlds next to your territory, starting with the pirates.</p>
<div class="box"><h2>Fleet</h2><small id="slots"></small><div id="ships"></div></div>
<div class="box"><h2>Station</h2><div id="blds"></div></div>
<button id="reset">Reset game</button>
<p><small>Prototype v0.2. Saves automatically in this browser, and your empire keeps earning while you are away.</small></p>
</main>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
